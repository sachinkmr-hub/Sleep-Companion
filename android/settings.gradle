pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        File localPropertiesFile = new File(settingsDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        }
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties and FLUTTER_ROOT not set"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Settings plugin that includes every Flutter plugin package as a Gradle
    // subproject. Without it the app gets no plugin subprojects and therefore
    // no transitive io.flutter:flutter_embedding_* dependency, so
    // MainActivity cannot resolve FlutterActivity.
    // (dev.flutter.flutter-gradle-plugin is the project plugin, and is
    // applied in app/build.gradle — it is not a substitute for this one.)
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.23" apply false
}

include ":app"
