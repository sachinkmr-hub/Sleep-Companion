name: Build Neend Companion Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Native Android Build Scaffolding
        run: |
          # Backup custom files
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/build.gradle /tmp/build.gradle
          
          # Regenerate missing gradle wrappers and scaffolding
          flutter create . --platforms=android --org com.neend --project-name neend_companion
          
          # Restore custom files
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/build.gradle android/app/build.gradle

      - name: Force Gradle 8.4 Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF
          
          # Ensure gradlew is executable
          chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neend-companion-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
