name: Build Neend Companion Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Native Android Build Scaffolding
        run: |
          # The repo does not track the Gradle wrapper or the launcher icons,
          # so `flutter create` is used to fill those in. It must not be
          # allowed to touch the Gradle config we do track.
          mkdir -p /tmp/android-backup
          cp android/app/src/main/AndroidManifest.xml /tmp/android-backup/
          cp android/app/build.gradle /tmp/android-backup/app-build.gradle
          cp android/build.gradle /tmp/android-backup/root-build.gradle
          cp android/settings.gradle /tmp/android-backup/
          cp android/gradle.properties /tmp/android-backup/

          flutter create . --platforms=android --org com.neend --project-name neend_companion

          cp /tmp/android-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/android-backup/app-build.gradle android/app/build.gradle
          cp /tmp/android-backup/root-build.gradle android/build.gradle
          cp /tmp/android-backup/settings.gradle android/settings.gradle
          cp /tmp/android-backup/gradle.properties android/gradle.properties

          # `flutter create` derives the package from --org plus --project-name
          # (com.neend.neend_companion), which is not this app's namespace
          # (com.neend.companion). Drop the duplicate activity it generates so
          # only the tracked MainActivity is compiled.
          rm -rf android/app/src/main/kotlin/com/neend/neend_companion

      - name: Force Gradle 8.4 Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF
          
          # Ensure gradlew is executable
          chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neend-companion-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
