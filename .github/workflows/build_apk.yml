name: Build Neend Companion Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Initialize Android Scaffolding
        run: |
          # Backup custom manifest and assets
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro 2>/dev/null || true
          
          # Generate pristine native Flutter Android configuration
          flutter create . --platforms=android --org com.neend --project-name neend_companion
          
          # Restore custom AndroidManifest and Proguard
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/proguard-rules.pro android/app/proguard-rules.pro 2>/dev/null || true
          
          # Ensure coreLibraryDesugaring and minSdk 24 are configured in android/app/build.gradle
          sed -i 's/minSdkVersion.*/minSdkVersion = 24/g' android/app/build.gradle* || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion = 34/g' android/app/build.gradle* || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neend-companion-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
